<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The American Paranormal | Advanced ITC Software</title>
<meta name="description" content="Official ITC anomaly detection suite. Real-time entropy monitoring and statistical ghost hunting tools. Companion to the book 'The American Paranormal'.">
<meta name="keywords" content="ITC software, ghost box, EVP, paranormal, entropy, skdietrich">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-dark: #080808;
    --text-main: #e0e0e0;
    --accent: #7C5CFF; /* The Purple from your book site */
    --border: #333;
  }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Rajdhani', sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  /* Deep Space Atmosphere */
  .bg-glow {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at 50% 30%, rgba(20, 20, 30, 1) 0%, #080808 80%);
    z-index: -1;
    pointer-events: none;
  }

  /* Logo Styling */
  .logo {
    width: 140px;
    height: 140px;
    /* Square with slight rounding, like a book cover or icon */
    border-radius: 12px; 
    margin-bottom: 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    border: 1px solid var(--border);
    object-fit: cover;
  }

  /* Typography - Matching the Books Site */
  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 400;
    font-size: 2.2rem;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin: 0 0 10px 0;
    color: #fff;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
    display: inline-block;
  }

  .subtitle {
    font-size: 1rem;
    color: #888;
    margin-bottom: 60px;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  /* App Grid */
  .grid {
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 900px;
    margin-bottom: 80px;
  }

  /* Card / Button Styling */
  a.card {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    padding: 25px;
    width: 220px;
    text-decoration: none;
    color: var(--text-main);
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  
  a.card:hover {
    border-color: var(--accent);
    background: rgba(124, 92, 255, 0.05);
    transform: translateY(-5px);
    box-shadow: 0 0 30px rgba(124, 92, 255, 0.15);
  }

  .tag {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #666; /* Muted tech color */
    margin-bottom: 12px;
  }
  
  h2 {
    margin: 0;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: 1px;
  }

  /* The "Return" Button - Matching your Book Buttons */
  .author-btn {
    text-decoration: none;
    color: #fff;
    border: 1px solid var(--accent);
    padding: 15px 40px;
    border-radius: 4px; /* Sharp corners like the book site */
    font-size: 0.85rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: all 0.3s ease;
    background: transparent;
    box-shadow: 0 0 15px rgba(124, 92, 255, 0.1);
  }

  .author-btn:hover {
    background: var(--accent);
    box-shadow: 0 0 30px rgba(124, 92, 255, 0.4);
    color: #fff;
  }

  .footer-note {
    margin-top: 30px;
    font-size: 0.6rem;
    color: #444;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="bg-glow"></div>

<img src="logo.png" alt="System Logo" class="logo">

<h1>The American Paranormal</h1>
<div class="subtitle">Advanced ITC Anomaly Lab</div>

<div class="grid">
  <a href="ultimate.html" class="card">
    <span class="tag">Hybrid Engine</span>
    <h2>ULTIMATE v3.3</h2>
  </a>

  <a href="psi.html" class="card">
    <span class="tag">Resonance Engine</span>
    <h2>PSI v3.2</h2>
  </a>

  <a href="max.html" class="card">
    <span class="tag">Scientific Engine</span>
    <h2>MAX v2.6</h2>
  </a>
</div>

<a href="https://skdietrich.github.io/books/" class="author-btn">
  Author Library
</a>

<div class="footer-note">Secure Context // Microphone Required</div>

</body>
</html>
