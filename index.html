<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The American Paranormal</title>
<style>
  body {
    background: #050505;
    color: #ffffff;
    font-family: sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  
  /* Background Glow */
  .glow {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124, 92, 255, 0.15) 0%, transparent 70%);
    z-index: -1;
    pointer-events: none;
  }

  /* Logo & Title */
  .logo {
    width: 120px;
    height: 120px;
    border-radius: 20%;
    margin-bottom: 20px;
    box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
  }
  h1 {
    font-weight: 300;
    letter-spacing: 6px;
    text-transform: uppercase;
    font-size: 1.8rem;
    margin: 0 0 40px 0;
    color: #ccc;
  }

  /* The Grid */
  .grid {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 900px;
  }

  /* Minimalist Cards */
  a.card {
    background: #111;
    border: 1px solid #333;
    padding: 30px;
    width: 200px;
    text-decoration: none;
    color: white;
    border-radius: 12px;
    transition: 0.2s ease;
  }
  
  a.card:hover {
    border-color: #fff;
    background: #161616;
    transform: translateY(-5px);
  }

  .tag {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #666;
    margin-bottom: 10px;
    display: block;
  }
  
  h2 {
    margin: 0;
    font-size: 1.2rem;
    font-weight: 400;
  }
  
  /* Footer */
  .footer {
    margin-top: 80px;
    font-size: 0.75rem;
    color: #444;
    letter-spacing: 1px;
    padding-bottom: 40px;
  }
  
  /* Button Hover Effect */
  .footer a:hover {
    background: #222;
    border-color: #7C5CFF !important;
    color: #fff !important;
  }
</style>
</head>
<body>

<div class="glow"></div>

<img src="logo.png" alt="Logo" class="logo">

<h1>The American Paranormal</h1>

<div class="grid">
  <a href="ultimate.html" class="card">
    <span class="tag" style="color:#7C5CFF">Hybrid</span>
    <h2>ULTIMATE v3.3</h2>
  </a>

  <a href="psi.html" class="card">
    <span class="tag" style="color:#00D4FF">Resonance</span>
    <h2>PSI v3.2</h2>
  </a>

  <a href="max.html" class="card">
    <span class="tag" style="color:#FF4D6D">Scientific</span>
    <h2>MAX v2.6</h2>
  </a>
</div>

<div class="footer">
  SECURE SYSTEM // MICROPHONE REQUIRED
  <br><br><br>
  
  <a href="https://skdietrich.github.io/books/" style="color: #666; text-decoration: none; border: 1px solid #333; padding: 12px 25px; border-radius: 30px; font-size: 0.7rem; transition: 0.3s; letter-spacing: 2px; text-transform: uppercase;">
    &larr; Return to Author Library
  </a>
</div>

</body>
</html>
